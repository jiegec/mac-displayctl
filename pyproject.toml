[project]
name = "mac-displayctl"
version = "0.1.0"
description = "Control macOS display modes, color formats, HDR, ICC profiles and timing."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
mac-displayctl = "mac_displayctl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mac_displayctl"]
